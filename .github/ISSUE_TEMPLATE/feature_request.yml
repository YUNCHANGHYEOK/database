name: 🚀 Feature Request
description: 새로운 기능 제안
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        새로운 기능을 제안해주셔서 감사합니다! 🎉
        
  - type: textarea
    id: description
    attributes:
      label: 📋 Description (설명)
      description: 구현하고 싶은 기능에 대해 자세히 설명해주세요.
      placeholder: 예) 주식 차트 실시간 업데이트 기능을 추가하고 싶습니다.
    validations:
      required: true
      
  - type: textarea
    id: motivation
    attributes:
      label: 💡 Motivation (동기)
      description: 왜 이 기능이 필요한가요?
      placeholder: 예) 사용자가 실시간으로 주가 변동을 확인할 수 있어야 합니다.
    validations:
      required: true
      
  - type: textarea
    id: todo
    attributes:
      label: ✅ To-do (해야 할 일)
      description: 구현을 위해 필요한 작업들을 나열해주세요.
      placeholder: |
        - [ ] API 연동
        - [ ] UI 구현
        - [ ] 테스트 작성
      value: |
        - [ ] 
        - [ ] 
    validations:
      required: true
      
  - type: textarea
    id: additional
    attributes:
      label: 📝 Additional Context (추가 정보)
      description: 추가로 전달하고 싶은 정보나 참고 자료가 있다면 작성해주세요.
      placeholder: 스크린샷, 링크, 참고 자료 등
    validations:
      required: false